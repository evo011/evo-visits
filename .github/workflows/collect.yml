# Faehrt etwa alle 15 Minuten (05:45-23:15 Uhr Berliner Zeit) den Sammler:
# ruft Besucherzahlen der EVO-Visits-API ab, frischt Wetter- und
# Ferienkontext auf, schreibt die Monats-CSVs (data/visits-YYYY-MM.csv)
# als Commit zurueck und deployt die statische Seite nach GitHub Pages.
# Die Cron-Zeiten sind UTC; das Abruffenster innerhalb der aktiven
# Stunden prueft das Skript selbst (--respect-window). Damit das
# Deploy klappt, muss in den Repo-Settings unter Pages die Quelle
# "GitHub Actions" gewaehlt sein.
# Jeder Lauf setzt per workflow_dispatch den naechsten an
# (GITHUB_TOKEN darf workflow_dispatch ausloesen), der Cron ist nur
# Reserve.

name: collect

on:
  schedule:
    # Reserve: startet die Kette neu, falls sie abreisst (deckt Sommer- und Winterzeit ab)
    - cron: "0,15,30,45 3-22 * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fetch_ok: ${{ steps.collect.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Wetter-/Ferien-Cache (data/visits.db, nicht im Git) ueberlebt so
      # zwischen den Laeufen; die CSVs bleiben die Quelle der Wahrheit.
      - uses: actions/cache/restore@v6
        with:
          path: data/visits.db
          key: evo-db-${{ github.run_id }}
          restore-keys: evo-db-

      - name: CSVs importieren
        run: python3 evo_visits.py import-csv

      - name: Besucherzahlen abrufen
        id: collect
        continue-on-error: true
        run: python3 evo_visits.py collect --respect-window --active-hours 05:45-23:15 --mode api

      - name: Wetter und Ferien auffrischen
        continue-on-error: true
        run: python3 evo_visits.py context

      - name: CSVs exportieren
        run: python3 evo_visits.py export-csv

      - name: Seite exportieren
        continue-on-error: true
        run: python3 evo_visits.py export --out site --forecast-snapshot data/forecasts

      - name: Daten committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          files=(data/visits-*.csv data/weather-*.csv data/forecasts/*.csv)
          if [ ${#files[@]} -gt 0 ]; then git add "${files[@]}"; fi
          if git diff --cached --quiet; then echo "keine neuen Daten"; exit 0; fi
          git commit -m "data: Besucherzahlen $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: data/visits.db
          key: evo-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy nach GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Abruf-Fehler kennzeichnen
        if: needs.collect.outputs.fetch_ok != 'true'
        run: |
          echo "::error::Abruf bei EVO fehlgeschlagen, Seite zeigt den letzten Stand"
          exit 1

  chain:
    needs: [collect, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Naechsten Lauf ansetzen
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          # naechster Termin :00/:15/:30/:45 (volle Viertelstunde), mindestens 2 min Abstand
          next=$(( (now / 900 + 1) * 900 ))
          if [ $(( next - now )) -lt 120 ]; then next=$(( next + 900 )); fi
          # nachts (ausserhalb 05:45-23:15 Berlin) bis 05:45 schlafen, hoechstens 5 h am Stueck
          hm=$(TZ=Europe/Berlin date -d "@$next" +%H%M); m=$(( 10#${hm:0:2} * 60 + 10#${hm:2:2} ))
          # Tag: 05:45 (345) bis 23:15 (1395); sonst schlafen bis 05:45, hoechstens 5 h am Stueck
          if [ "$m" -lt 345 ] || [ "$m" -gt 1395 ]; then
            if [ "$m" -gt 1395 ]; then day=tomorrow; else day=today; fi
            target=$(TZ=Europe/Berlin date -d "$(TZ=Europe/Berlin date -d "@$next" +%F) 05:45" +%s)
            if [ "$day" = tomorrow ]; then target=$(( target + 86400 )); fi
            limit=$(( now + 18000 ))
            next=$(( target < limit ? target : limit ))
          fi
          echo "naechster Lauf: $(TZ=Europe/Berlin date -d "@$next" '+%F %H:%M') Berlin"
          sleep $(( next - now ))
          # nur weiterketten, wenn nicht schon ein anderer Lauf wartet oder laeuft
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow collect.yml --limit 20 \
            --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\"))] | length")
          if [ "$others" -gt 0 ]; then
            echo "es wartet schon ein Lauf, keine neue Kette"
            exit 0
          fi
          gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref main
